name: Validación

on:
  push:
  pull_request:
  # Home Assistant y HACS cambian sus requisitos cada poco: conviene enterarse
  # aunque nadie toque el repositorio.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # El núcleo se prueba sin Home Assistant; la integración, con él.
          pip install -r requirements.txt pytest
          pip install pytest-homeassistant-custom-component home-assistant-frontend
      - name: Núcleo
        run: python -m pytest -q
      - name: Integración
        run: python -m pytest tests/ha -q
