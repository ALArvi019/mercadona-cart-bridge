services:
  mercadona-cart-bridge:
    build: .
    # Para desplegar en la Raspberry sin construir allí, publica la imagen y usa:
    # image: ghcr.io/alarvi019/mercadona-cart-bridge:latest
    container_name: mercadona-cart-bridge
    restart: unless-stopped
    ports:
      - "8099:8099"
    env_file:
      - .env
    volumes:
      # Aquí viven la sesión renovada, el catálogo y los alias aprendidos.
      - mercadona-data:/data
    environment:
      - TZ=Europe/Madrid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 30s

volumes:
  mercadona-data:
