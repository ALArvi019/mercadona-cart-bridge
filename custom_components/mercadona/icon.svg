    <path d="M 356 163 A 38 38 0 0 1 394 201" fill="none" stroke="url(#yellow-dark)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 374 181 A 18 18 0 0 1 392 199" fill="none" stroke="url(#yellow-dark)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <circle cx="398" cy="205" r="4" fill="#FFE054"/>
