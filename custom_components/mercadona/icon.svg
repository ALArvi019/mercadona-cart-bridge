    <path d="M 230 335 L 215 385" fill="none" stroke="url(#metal-silver-dark)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 345 335 L 335 385" fill="none" stroke="url(#metal-silver-dark)" stroke-width="7" stroke-linecap="round"/>
    <line x1="215" y1="385" x2="335" y2="385" stroke="url(#metal-silver-dark)" stroke-width="6" stroke-linecap="round"/>

    <g transform="translate(215, 385)">
