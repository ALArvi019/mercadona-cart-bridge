<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-radial-dark" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0B3020"/>
      <stop offset="55%" stop-color="#041A11"/>
      <stop offset="100%" stop-color="#020D08"/>
    </radialGradient>

    <linearGradient id="green-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#007D40"/>
    </linearGradient>

    <linearGradient id="yellow-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE054"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>

    <linearGradient id="metal-silver-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>

    <linearGradient id="glass-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="shadow-dark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="glow-green-dark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00C853" flood-opacity="0.45"/>
    </filter>

    <filter id="glow-yellow-dark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF9100" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-radial-dark)" stroke="#0F472E" stroke-width="4" filter="url(#shadow-dark)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#green-dark)" stroke-width="2" stroke-opacity="0.35"/>
  <path d="M 20 124 C 20 66 66 20 124 20 L 388 20 C 446 20 492 66 492 124 L 492 190 L 20 310 Z" fill="url(#glass-dark)"/>

  <path d="M 90 385 Q 256 440 422 385" fill="none" stroke="url(#green-dark)" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.45" filter="url(#glow-green-dark)"/>
  <path d="M 130 388 Q 256 432 382 388" fill="none" stroke="url(#yellow-dark)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

